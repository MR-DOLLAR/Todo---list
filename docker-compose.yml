# One-command start: docker compose up --build   → http://localhost:4000
# Different host port: put LEAFCARE_PORT=4300 in a .env file next to this file
services:
  ml-service:
    build: ./ml-service
    restart: unless-stopped
    # The trained model is baked into the image. To use your own, uncomment:
    # volumes:
    #   - ./ml-service/models:/app/models:ro

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true   # forwards Ctrl+C / docker stop to node so it exits immediately
    environment:
      ML_SERVICE_URL: http://ml-service:5001
      LEAFCARE_PUBLIC_URL: http://localhost:${LEAFCARE_PORT:-4000}
    volumes:
      - server-data:/data   # diagnosis history + uploaded images
    ports:
      - "${LEAFCARE_PORT:-4000}:4000"
    depends_on:
      ml-service:
        condition: service_healthy

volumes:
  server-data:
